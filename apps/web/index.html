<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!--
      CompHQ is a dark app and only a dark app, so there is no data-theme
      attribute to set. The brand file declares its values on :root rather than
      behind a theme selector, and MDS component CSS never keys on data-theme —
      only the tokens package does, and there is no second theme to key. An
      attribute naming the one theme that exists is a switch with one position.
    -->
    <!--
      The stylesheet is a separate render-blocking file, so the document paints
      its own default before that file lands. On a gym projector that is a
      white flash across the room. This rule is the only styling that exists at
      that point; the value mirrors --mds-surface-page in
      src/tokens/brand-comphq.css, and `pnpm check:tokens` fails if the two
      stop agreeing.
    -->
    <style>
      html {
        background: #0a0d12;
      }
    </style>
    <title>CompHQ</title>
    <meta name="description" content="Competition management and athlete schedule" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
